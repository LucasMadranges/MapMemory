name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  # Premier job - CI avec tests, lint et build
  ci:
    name: CI Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Configuration de Node.js et cache
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Installation des dépendances
      - run: npm ci --legacy-peer-deps
      - run: npx cypress install
      - uses: nrwl/nx-set-shas@v4

      # Exécution des tests et build
      - run: npx nx affected -t lint test build e2e

      # Archiver les builds pour le job suivant
      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # Second job - Publication des images Docker
  publish-containers:
    name: Build & Push Docker Images
    needs: ci # Ce job s'exécute seulement si le job ci réussit
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    strategy:
      matrix:
        service: [appweb, gateway, users, memory, friends]
        include:
          - service: appweb
            context: .
            dockerfile: ./apps/appweb/Dockerfile
          - service: gateway
            context: .
            dockerfile: ./apps/gateway/Dockerfile
          - service: users
            context: .
            dockerfile: ./apps/users/Dockerfile
          - service: memory
            context: .
            dockerfile: ./apps/memory/Dockerfile
          - service: friends
            context: .
            dockerfile: ./apps/friends/Dockerfile

    env:
      REGISTRY: ghcr.io
      IMAGE_PREFIX: ${{ github.repository }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Télécharger les artefacts du build
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v3
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
