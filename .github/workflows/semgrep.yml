name: Code Security Scan (JS / TS / Go)

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep (JS / TS / Go)
        uses: semgrep/semgrep-action@v1
        with:
          generateSarif: true
          config: |
            p/javascript
            p/typescript
            p/go
            p/security-audit
