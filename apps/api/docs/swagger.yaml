basePath: /
definitions:
  auth.LoginDTO:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  ent.User:
    properties:
      avatar:
        description: Avatar holds the value of the "avatar" field.
        type: string
      email:
        description: Email holds the value of the "email" field.
        type: string
      firstname:
        description: Firstname holds the value of the "firstname" field.
        type: string
      id:
        description: ID of the ent.
        type: integer
      lastname:
        description: Lastname holds the value of the "lastname" field.
        type: string
    type: object
  errors.ErrorRequest:
    properties:
      message:
        example: Failed to retrieve users
        type: string
      success:
        example: false
        type: boolean
    type: object
  user.CreateUserDTO:
    properties:
      avatar:
        example: https://example.com/
        type: string
      email:
        example: lucasmadranges@gmail.com
        type: string
      firstname:
        example: Lucas
        minLength: 5
        type: string
      lastname:
        example: Madranges
        minLength: 5
        type: string
      password:
        example: Azertye789456&!
        minLength: 12
        type: string
    required:
      - email
      - firstname
      - lastname
      - password
    type: object
host: localhost:4000
info:
  contact: {}
  description: API avec Fiber, Ent et Swagger
  title: Go Fiber API
  version: '1.0'
paths:
  /auth/login:
    post:
      consumes:
        - application/json
      description: Authenticate user with email and password
      parameters:
        - description: Login credentials
          in: body
          name: credentials
          required: true
          schema:
            $ref: '#/definitions/auth.LoginDTO'
      produces:
        - application/json
      responses:
        '200':
          description: Returns JWT token
          schema:
            additionalProperties:
              type: string
            type: object
        '400':
          description: Invalid request body
          schema:
            additionalProperties:
              type: string
            type: object
        '401':
          description: Invalid credentials
          schema:
            additionalProperties:
              type: string
            type: object
      summary: User login
      tags:
        - auth
  /users:
    get:
      description: Retrieve a list of all users
      produces:
        - application/json
      responses:
        '201':
          description: List of users
          schema:
            items:
              $ref: '#/definitions/ent.User'
            type: array
        '400':
          description: Failed to retrieve users
          schema:
            $ref: '#/definitions/errors.ErrorRequest'
        '500':
          description: Internal server error
          schema:
            $ref: '#/definitions/errors.ErrorRequest'
      summary: Get all users
      tags:
        - Users
    post:
      consumes:
        - application/json
      description: Create a new userrrrrr account
      parameters:
        - description: User payload
          in: body
          name: user
          required: true
          schema:
            $ref: '#/definitions/user.CreateUserDTO'
      produces:
        - application/json
      responses:
        '201':
          description: User created successfully
          schema:
            $ref: '#/definitions/ent.User'
        '400':
          description: Invalid request body
          schema:
            $ref: '#/definitions/errors.ErrorRequest'
        '409':
          description: User already exists
          schema:
            $ref: '#/definitions/errors.ErrorRequest'
        '500':
          description: Internal server error
          schema:
            $ref: '#/definitions/errors.ErrorRequest'
      summary: Create user
      tags:
        - Users
swagger: '2.0'
