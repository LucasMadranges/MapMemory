services:
  db-mapmemory:
    image: postgres:16
    container_name: db-mapmemory
    ports:
      - '5432:5432'
    volumes:
      - db_users_data:/var/lib/postgresql/data
    env_file:
      - .env
    networks:
      - MapMemoryNetworks

volumes:
  db_users_data:

networks:
  MapMemoryNetworks:
    driver: bridge
