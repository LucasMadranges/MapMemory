services:
  api-mapmemory:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: api-mapmemory
    ports:
      - '4000:4000'
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=db-mapmemory
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
    depends_on:
      - db-mapmemory
    networks:
      - MapMemoryNetworks
    restart: unless-stopped

  db-mapmemory:
    image: postgres:16
    container_name: db-mapmemory
    ports:
      - '5432:5432'
    volumes:
      - db_users_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - MapMemoryNetworks

volumes:
  db_users_data:

networks:
  MapMemoryNetworks:
    driver: bridge
